packages:
  - .
# Keep one core/props/Circuit JSON version throughout the tscircuit tree.
# Local sibling checkouts (../core, ../props, ../circuit-json, ../cli,
# ../pcb-spice-pipeline) carry the pcbSpiceChannel / ibis sha256 support.
blockExoticSubdeps: false
allowBuilds:
  esbuild: true
  '@resvg/resvg-js': true
  sharp: false
overrides:
  '@tscircuit/core': file:../core
  '@tscircuit/props': file:../props
  '@tscircuit/cli': file:../cli
  '@tscircuit/eval': 0.0.1538
  tscircuit: 0.0.2940
  "@tscircuit/cableprinter": "0.0.6"
  "@tscircuit/capacity-autorouter": "0.0.974"
  "@tscircuit/checks": "0.0.248"
  "@tscircuit/circuit-json-util": "0.0.121"
  "@tscircuit/create-fdm-enclosure": "0.0.7"
  "@tscircuit/footprinter": "0.0.437"
  "@tscircuit/infgrid-ijump-astar": "0.0.35"
  "@tscircuit/matchpack": "0.0.100"
  "@tscircuit/math-utils": "0.0.38"
  "@tscircuit/modelprinter": "0.0.34"
  "@tscircuit/schematic-match-adapt": "0.0.22"
  "bpc-graph": "0.0.67"
  "circuit-json": file:../circuit-json
  "circuit-json-to-bpc": "0.0.14"
  "circuit-json-to-connectivity-map": "0.0.33"
  "circuit-json-to-spice": "0.0.46"
  "schematic-symbols": "0.0.248"
  "spicets": "0.0.5"
  '@tscircuit/fanout-solver': 0.0.81
  '@tscircuit/pcb-spice-pipeline': file:../pcb-spice-pipeline
minimumReleaseAgeExclude:
  - '@tscircuit/runframe@0.0.3012'
  - tscircuit@0.0.2940
  - "@tscircuit/props@0.0.707"
  - "circuit-json@0.0.531"
