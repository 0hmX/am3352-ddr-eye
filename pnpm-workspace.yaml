packages:
  - .
  - packages/ibis-to-spice
# Overrides inject the core/props PR previews into tscircuit's transitive dependencies.
# Exotic subdependencies remain enabled until those previews are published.
blockExoticSubdeps: false
allowBuilds:
  esbuild: true
  '@resvg/resvg-js': true
  sharp: false
  pcb-spice-pipeline@https://codeload.github.com/tscircuit/pcb-spice-pipeline/tar.gz/b8c2755295cd0be7845cb488ce65a6ccaca36893: true
overrides:
  '@tscircuit/core': https://pkg.pr.new/tscircuit/core/@tscircuit/core@898e8cf
  '@tscircuit/props': https://pkg.pr.new/@tscircuit/props@4566b91
  '@tscircuit/ibis-to-spice': workspace:*
  '@tscircuit/cli': 0.1.2237
  '@tscircuit/eval': 0.0.1538
  tscircuit: 0.0.2940
  "@tscircuit/cableprinter": "0.0.6"
  "@tscircuit/capacity-autorouter": "0.0.974"
  "@tscircuit/checks": "0.0.248"
  "@tscircuit/circuit-json-util": "0.0.121"
  "@tscircuit/create-fdm-enclosure": "0.0.7"
  "@tscircuit/footprinter": "0.0.437"
  "@tscircuit/infgrid-ijump-astar": "0.0.35"
  "@tscircuit/matchpack": "0.0.100"
  "@tscircuit/math-utils": "0.0.38"
  "@tscircuit/modelprinter": "0.0.34"
  "@tscircuit/schematic-match-adapt": "0.0.22"
  "bpc-graph": "0.0.67"
  "circuit-json": 0.0.531
  "circuit-json-to-bpc": "0.0.14"
  "circuit-json-to-connectivity-map": "0.0.33"
  "circuit-json-to-spice": "0.0.46"
  "schematic-symbols": "0.0.248"
  "spicets": "0.0.5"
  '@tscircuit/fanout-solver': 0.0.81
minimumReleaseAgeExclude:
  - '@tscircuit/runframe@0.0.3012'
  - tscircuit@0.0.2940
  - circuit-json@0.0.531
