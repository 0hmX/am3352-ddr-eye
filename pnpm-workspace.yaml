packages:
  - .
# Keep one core/props/Circuit JSON version throughout the tscircuit tree.
# Core is an immutable preview with IBIS and pcb_stackup support.
blockExoticSubdeps: false
allowBuilds:
  esbuild: true
  '@resvg/resvg-js': true
  sharp: false
overrides:
  '@tscircuit/core': https://api.github.com/repos/tscircuit/core/tarball/f788ce72605412158dce363c218367ea07e1595a
  '@tscircuit/props': https://api.github.com/repos/tscircuit/props/tarball/045f345751e23909523a85e17ba9cfd94b74ad08
  '@tscircuit/cli': https://api.github.com/repos/tscircuit/cli/tarball/494c2f8f683aad74fc1e6f8fa9c7642e247c6a09
  '@tscircuit/eval': 0.0.1538
  tscircuit: 0.0.2940
  "@tscircuit/cableprinter": "0.0.6"
  "@tscircuit/capacity-autorouter": "0.0.974"
  "@tscircuit/checks": "0.0.248"
  "@tscircuit/circuit-json-util": "0.0.121"
  "@tscircuit/create-fdm-enclosure": "0.0.7"
  "@tscircuit/footprinter": "0.0.437"
  "@tscircuit/infgrid-ijump-astar": "0.0.35"
  "@tscircuit/matchpack": "0.0.100"
  "@tscircuit/math-utils": "0.0.38"
  "@tscircuit/modelprinter": "0.0.34"
  "@tscircuit/schematic-match-adapt": "0.0.22"
  "bpc-graph": "0.0.67"
  "circuit-json": https://api.github.com/repos/tscircuit/circuit-json/tarball/ac69acd282d521bab7f3156aa3be3069584ba9d7
  "circuit-json-to-bpc": "0.0.14"
  "circuit-json-to-connectivity-map": "0.0.33"
  "circuit-json-to-spice": "0.0.46"
  "schematic-symbols": "0.0.248"
  "spicets": "0.0.5"
  '@tscircuit/fanout-solver': 0.0.81
  '@tscircuit/pcb-spice-pipeline': https://api.github.com/repos/tscircuit/pcb-spice-pipeline/tarball/6fa915055b4de27c8430b3a47985af8ea4bf6ed6
minimumReleaseAgeExclude:
  - '@tscircuit/runframe@0.0.3012'
  - tscircuit@0.0.2940
  - "@tscircuit/props@0.0.707"
  - "circuit-json@0.0.531"
